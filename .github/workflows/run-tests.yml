name: JUnit Tests

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'

    - name: Compile
      run: |
        javac -cp lib/junit-platform-console-standalone-6.0.3.jar src/*.java

    - name: Test
      run: |
        java -jar lib/junit-platform-console-standalone-6.0.3.jar execute -cp src --scan-classpath